services:
  web:
    build: .
    image: event-tracker:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config.json:/app/config.json:ro
      - events:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  crawler:
    image: event-tracker:local
    build: .
    command: ["python", "-m", "event_tracker", "crawl"]
    profiles: ["crawl"]
    volumes:
      - ./config.json:/app/config.json:ro
      - events:/data
volumes:
  events:
