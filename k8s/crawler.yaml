apiVersion: batch/v1
kind: CronJob
metadata:
  name: event-tracker-crawler
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: event-tracker-crawler
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: event-tracker
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: crawler
              image: event-tracker:local
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "event_tracker", "crawl"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: EVENT_TRACKER_CONFIG
                  value: /config/config.json
                - name: EVENT_TRACKER_DB
                  value: /data/events.sqlite3
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: event-tracker-config
            - name: data
              persistentVolumeClaim:
                claimName: event-tracker-data
            - name: tmp
              emptyDir: {}
